name: CI

# ============================================================
# Déclenchement
# ============================================================
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


# ============================================================
# JOB 1 : Backend - Tests Python
# ============================================================
jobs:

  backend-test:
    name: Backend - Tests Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # Récupérer le code
      - name: Récupérer le code
        uses: actions/checkout@v4


      # Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt


      # Installer TShark
      - name: Installer TShark
        run: |
          sudo apt-get update

          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark


      # Installer les dépendances
      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 120 --retries 5 -r requirements.txt


      # Lancer les tests
      - name: Lancer les tests
        env:
          MONGODB_URI_AUTH: "mongodb://fake:27017/test"
          MONGODB_URI_ANALYSES: "mongodb://fake:27017/test"
          VIRUSTOTAL_API_KEY: "fake-key-for-ci"
          JWT_SECRET: "fake-secret-for-ci"

        run: |
          python -m pytest -v


  # ==========================================================
  # JOB 2 : Frontend - Build React
  # ==========================================================

  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Installer les dépendances
        run: npm ci


      - name: Build de production
        run: npm run build


  # ==========================================================
  # JOB 3 : Docker - Build de toutes les images
  # ==========================================================

  docker-build:
    name: Docker - Vérifier les builds
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # API Gateway
      # ------------------------------------------------------

      - name: Build API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/api/Dockerfile
          push: false
          tags: api-gateway-ci:latest


      # ------------------------------------------------------
      # Analyzer Service
      # ------------------------------------------------------

      - name: Build Analyzer Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/analyzer/Dockerfile
          push: false
          tags: analyzer-service-ci:latest


      # ------------------------------------------------------
      # Enrichment Service
      # ------------------------------------------------------

      - name: Build Enrichment Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/enrichment/Dockerfile
          push: false
          tags: enrichment-service-ci:latest


      # ------------------------------------------------------
      # Detector Service
      # ------------------------------------------------------

      - name: Build Detector Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/detector/Dockerfile
          push: false
          tags: detector-service-ci:latest


      # ------------------------------------------------------
      # Frontend
      # ------------------------------------------------------

      - name: Build Frontend Docker
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: frontend-ci:latest


  # ==========================================================
  # JOB 4 : Sécurité - Dépendances Python
  # ==========================================================

  security-python:
    name: Sécurité - Dépendances Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Installer pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit


      - name: Scanner les dépendances Python
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt


  # ==========================================================
  # JOB 5 : Sécurité - Dépendances Node
  # ==========================================================

  security-node:
    name: Sécurité - Dépendances Node
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Installer les dépendances
        run: npm ci


      - name: Scanner les dépendances Node
        continue-on-error: true
        run: |
          npm audit


  # ==========================================================
  # JOB 6 : Sécurité - Images Docker
  # ==========================================================

  security-docker:
    name: Sécurité - Scan des images Docker
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ======================================================
      # API Gateway
      # ======================================================

      - name: Build API Gateway pour scan
        run: |
          docker build \
            -t api-gateway-security:latest \
            -f ./backend/api/Dockerfile \
            .

      - name: Scan API Gateway avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: api-gateway-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Analyzer
      # ======================================================

      - name: Build Analyzer pour scan
        run: |
          docker build \
            -t analyzer-security:latest \
            -f ./backend/analyzer/Dockerfile \
            .

      - name: Scan Analyzer avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: analyzer-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Enrichment
      # ======================================================

      - name: Build Enrichment pour scan
        run: |
          docker build \
            -t enrichment-security:latest \
            -f ./backend/enrichment/Dockerfile \
            .

      - name: Scan Enrichment avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: enrichment-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Detector
      # ======================================================

      - name: Build Detector pour scan
        run: |
          docker build \
            -t detector-security:latest \
            -f ./backend/detector/Dockerfile \
            .

      - name: Scan Detector avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: detector-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Frontend
      # ======================================================

      - name: Build Frontend pour scan
        run: |
          docker build \
            -t frontend-security:latest \
            -f ./frontend/Dockerfile \
            ./frontend

      - name: Scan Frontend avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: frontend-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"