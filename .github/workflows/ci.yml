name: CI

# Se déclenche à chaque push et à chaque pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Backend : dépendances + tests ----------
  backend-test:
    name: Backend - Tests Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer TShark
        run: |
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        # Variables factices pour que l'app démarre en CI sans vrais secrets
        env:
          MONGODB_URI_AUTH: "mongodb://fake:27017/test"
          MONGODB_URI_ANALYSES: "mongodb://fake:27017/test"
          VIRUSTOTAL_API_KEY: "fake-key-for-ci"
          JWT_SECRET: "fake-secret-for-ci"
        run: python -m pytest -v

  # ---------- Frontend : dépendances + build ----------
  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm install

      - name: Build de production
        run: npm run build

  # ---------- Vérifie que les images Docker buildent ----------
  docker-build:
    name: Docker - Vérifier les builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t backend-ci-check ./backend

      - name: Build image frontend
        run: docker build -t frontend-ci-check ./frontend

  # ========== SÉCURITÉ (mode informatif : n'échoue jamais la pipeline) ==========

  # ---------- Scan des dépendances Python ----------
  security-python:
    name: Sécurité - Dépendances Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pip-audit
        run: pip install pip-audit

      - name: Scanner les dépendances (informatif)
        # continue-on-error : le job reste vert même si des vulnérabilités
        # sont trouvées. À enlever plus tard pour bloquer la pipeline
        # sur les failles critiques une fois les dépendances nettoyées.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  # ---------- Scan des dépendances Node ----------
  security-node:
    name: Sécurité - Dépendances Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Scanner les dépendances (informatif)
        continue-on-error: true
        run: npm audit

  # ---------- Scan des images Docker ----------
  security-docker:
    name: Sécurité - Images Docker
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t backend-security-scan ./backend

      - name: Scanner l'image backend avec Trivy (informatif)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: backend-security-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Build image frontend
        run: docker build -t frontend-security-scan ./frontend

      - name: Scanner l'image frontend avec Trivy (informatif)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: frontend-security-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"