name: CI

# ============================================================
# Déclenchement
# ============================================================
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Permissions nécessaires pour pousser vers GHCR (GITHUB_TOKEN)
permissions:
  contents: read
  packages: write

# ============================================================
# JOB 1 : Backend - Tests Python
# ============================================================
jobs:

  backend-test:
    name: Backend - Tests Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # Récupérer le code
      - name: Récupérer le code
        uses: actions/checkout@v4


      # Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt


      # Installer TShark
      - name: Installer TShark
        run: |
          sudo apt-get update

          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark


      # Installer les dépendances
      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 120 --retries 5 -r requirements.txt
          pip install ruff bandit


      # Lint avec Ruff
      - name: Lint - Ruff
        run: |
          ruff check .


      # SAST - Bandit (analyse statique du code Python)
      - name: SAST - Bandit
        run: |
          bandit -r . -ll -x ./tests


      # Lancer les tests
      - name: Lancer les tests
        env:
          MONGODB_URI_AUTH: "mongodb://fake:27017/test"
          MONGODB_URI_ANALYSES: "mongodb://fake:27017/test"
          VIRUSTOTAL_API_KEY: "fake-key-for-ci"
          JWT_SECRET: "fake-secret-for-ci"

        run: |
          python -m pytest -v


  # ==========================================================
  # JOB 2 : Frontend - Build React
  # ==========================================================

  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Installer les dépendances
        run: npm ci


      - name: Build de production
        run: npm run build


  # ==========================================================
  # JOB 3 : Sécurité - Secrets (Gitleaks)
  # ==========================================================
  # Scanne le code (et l'historique) à la recherche de secrets
  # committés par erreur : clés API, tokens, mots de passe...
  # Job indépendant, exécuté le plus tôt possible.
  # ==========================================================

  security-secrets:
    name: Sécurité - Détection de secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Scanner avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # JOB 4 : Sécurité - SAST multi-langage (Semgrep)
  # ==========================================================
  # Analyse statique du code backend ET frontend : injections,
  # failles OWASP Top 10, mauvaises pratiques de sécurité.
  # ==========================================================

  security-sast:
    name: Sécurité - SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Scanner avec Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten


  # ==========================================================
  # JOB 5 : Sécurité - Lint des Dockerfiles (Hadolint)
  # ==========================================================
  # Vérifie les bonnes pratiques de sécurité dans chaque
  # Dockerfile (utilisateur non-root, versions figées, etc.)
  # ==========================================================

  security-dockerfile-lint:
    name: Sécurité - Lint Dockerfiles (Hadolint)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: API Gateway
            dockerfile: backend/app/api/Dockerfile
          - name: Analyzer Service
            dockerfile: backend/app/analyzer/Dockerfile
          - name: Enrichment Service
            dockerfile: backend/app/enrichment/Dockerfile
          - name: Detector Service
            dockerfile: backend/app/detector/Dockerfile
          - name: Auth Service
            dockerfile: backend/app/auth/Dockerfile
          - name: Frontend
            dockerfile: frontend/Dockerfile

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Hadolint - ${{ matrix.name }}
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: warning


  # ==========================================================
  # JOB 6 : Sécurité - Dependency Review (PR uniquement)
  # ==========================================================
  # Bloque les PR qui introduisent une dépendance avec une
  # vulnérabilité connue de sévérité élevée.
  # ==========================================================

  security-dependency-review:
    name: Sécurité - Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ==========================================================
  # JOB 7 : Docker - Build & publication GHCR
  # ==========================================================
  # - Sur PR : build local uniquement (push: false), sert de vérification.
  # - Sur push vers main : build + push vers ghcr.io.
  # Génère aussi un SBOM (inventaire des composants) par image.
  # Adapte le nom d'utilisateur/organisation GHCR si besoin (par défaut :
  # ghcr.io/<owner>/<repo>/<service>).
  # ==========================================================

  docker-build:
    name: Docker - Build & publication GHCR
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build
      - security-secrets

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Connexion à GHCR (uniquement nécessaire pour le push, mais sans
      # danger de se connecter aussi lors des PR : aucun push n'aura lieu)
      - name: Connexion à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # API Gateway
      # ------------------------------------------------------

      - name: Build & push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/app/api/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api-gateway:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api-gateway:${{ github.sha }}
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: SBOM - API Gateway
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api-gateway:${{ github.sha }}
          output-file: sbom-api-gateway.spdx.json


      # ------------------------------------------------------
      # Analyzer Service
      # ------------------------------------------------------

      - name: Build & push Analyzer Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/app/analyzer/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/analyzer-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/analyzer-service:${{ github.sha }}
          cache-from: type=gha,scope=analyzer-service
          cache-to: type=gha,mode=max,scope=analyzer-service

      - name: SBOM - Analyzer Service
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/analyzer-service:${{ github.sha }}
          output-file: sbom-analyzer-service.spdx.json


      # ------------------------------------------------------
      # Enrichment Service
      # ------------------------------------------------------

      - name: Build & push Enrichment Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/app/enrichment/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/enrichment-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/enrichment-service:${{ github.sha }}
          cache-from: type=gha,scope=enrichment-service
          cache-to: type=gha,mode=max,scope=enrichment-service

      - name: SBOM - Enrichment Service
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/enrichment-service:${{ github.sha }}
          output-file: sbom-enrichment-service.spdx.json


      # ------------------------------------------------------
      # Detector Service
      # ------------------------------------------------------

      - name: Build & push Detector Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/app/detector/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/detector-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/detector-service:${{ github.sha }}
          cache-from: type=gha,scope=detector-service
          cache-to: type=gha,mode=max,scope=detector-service

      - name: SBOM - Detector Service
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/detector-service:${{ github.sha }}
          output-file: sbom-detector-service.spdx.json


      # ------------------------------------------------------
      # Auth Service
      # ------------------------------------------------------

      - name: Build & push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/app/auth/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auth-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auth-service:${{ github.sha }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service

      - name: SBOM - Auth Service
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/auth-service:${{ github.sha }}
          output-file: sbom-auth-service.spdx.json


      # ------------------------------------------------------
      # Frontend
      # ------------------------------------------------------

      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: SBOM - Frontend
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ github.sha }}
          output-file: sbom-frontend.spdx.json


      # ------------------------------------------------------
      # Publication des SBOM en artefacts du workflow
      # ------------------------------------------------------

      - name: Publier les SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: sbom-*.spdx.json
          retention-days: 30


  # ==========================================================
  # JOB 8 : Health check - Vérification des services au démarrage
  # ==========================================================
  # Lance la stack via docker-compose (à adapter si le fichier
  # s'appelle différemment) et vérifie que chaque service répond
  # sur son endpoint /health avant de tout arrêter.
  # ==========================================================

  health-check:
    name: Health check - Démarrage des services
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Démarrer la stack
        run: |
          docker compose up -d --build


      - name: Attendre le démarrage
        run: sleep 15


      - name: Vérifier API Gateway
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health

      - name: Vérifier Analyzer Service
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8001/health

      - name: Vérifier Detector Service
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8002/health

      - name: Vérifier Enrichment Service
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8003/health

      - name: Vérifier Auth Service
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8004/health

      - name: Vérifier Frontend
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:3000


      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs


      - name: Arrêter la stack
        if: always()
        run: docker compose down -v


  # ==========================================================
  # JOB 9 : Sécurité - Dépendances Python
  # ==========================================================

  security-python:
    name: Sécurité - Dépendances Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Installer pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit


      - name: Scanner les dépendances Python
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt


  # ==========================================================
  # JOB 10 : Sécurité - Dépendances Node
  # ==========================================================

  security-node:
    name: Sécurité - Dépendances Node
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json


      - name: Installer les dépendances
        run: npm ci


      - name: Scanner les dépendances Node
        continue-on-error: true
        run: |
          npm audit


  # ==========================================================
  # JOB 11 : Sécurité - Images Docker
  # ==========================================================

  security-docker:
    name: Sécurité - Scan des images Docker
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4


      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ======================================================
      # API Gateway
      # ======================================================

      - name: Build API Gateway pour scan
        run: |
          docker build \
            -t api-gateway-security:latest \
            -f ./backend/app/api/Dockerfile \
            .

      - name: Scan API Gateway avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: api-gateway-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Analyzer
      # ======================================================

      - name: Build Analyzer pour scan
        run: |
          docker build \
            -t analyzer-security:latest \
            -f ./backend/app/analyzer/Dockerfile \
            .

      - name: Scan Analyzer avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: analyzer-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Enrichment
      # ======================================================

      - name: Build Enrichment pour scan
        run: |
          docker build \
            -t enrichment-security:latest \
            -f ./backend/app/enrichment/Dockerfile \
            .

      - name: Scan Enrichment avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: enrichment-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Detector
      # ======================================================

      - name: Build Detector pour scan
        run: |
          docker build \
            -t detector-security:latest \
            -f ./backend/app/detector/Dockerfile \
            .

      - name: Scan Detector avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: detector-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Auth Service
      # ======================================================

      - name: Build Auth Service pour scan
        run: |
          docker build \
            -t auth-service-security:latest \
            -f ./backend/app/auth/Dockerfile \
            .

      - name: Scan Auth Service avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: auth-service-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"


      # ======================================================
      # Frontend
      # ======================================================

      - name: Build Frontend pour scan
        run: |
          docker build \
            -t frontend-security:latest \
            -f ./frontend/Dockerfile \
            ./frontend

      - name: Scan Frontend avec Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: frontend-security:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"