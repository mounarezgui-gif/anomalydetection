name: CI

# Se déclenche à chaque push et à chaque pull request vers main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Backend : dépendances + tests ----------
  backend-test:
    name: Backend - Tests Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        # Variables factices pour que l'app démarre en CI sans vrais secrets
        env:
          MONGODB_URI_AUTH: "mongodb://fake:27017/test"
          MONGODB_URI_ANALYSES: "mongodb://fake:27017/test"
          VIRUSTOTAL_API_KEY: "fake-key-for-ci"
          JWT_SECRET: "fake-secret-for-ci"
        run: python -m pytest -v

  # ---------- Frontend : dépendances + build ----------
  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm install

      - name: Build de production
        run: npm run build

  # ---------- Vérifie que les images Docker buildent ----------
  docker-build:
    name: Docker - Vérifier les builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t backend-ci-check ./backend

      - name: Build image frontend
        run: docker build -t frontend-ci-check ./frontend