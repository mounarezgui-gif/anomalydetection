name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy-backend:
    name: Deploy - Railway (Backend)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Déployer sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          MONGODB_URI_AUTH: ${{ secrets.MONGODB_URI_AUTH }}
          MONGODB_URI_ANALYSES: ${{ secrets.MONGODB_URI_ANALYSES }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_AUTH: ${{ secrets.MONGODB_DB_AUTH }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npm install -g @railway/cli
          if [ -n "$MONGODB_URI_AUTH" ]; then railway variables set MONGODB_URI_AUTH="$MONGODB_URI_AUTH" --service anomalydetection; fi
          if [ -n "$MONGODB_URI_ANALYSES" ]; then railway variables set MONGODB_URI_ANALYSES="$MONGODB_URI_ANALYSES" --service anomalydetection; fi
          if [ -n "$MONGODB_URI" ]; then railway variables set MONGODB_URI="$MONGODB_URI" --service anomalydetection; fi
          if [ -n "$MONGODB_DB_AUTH" ]; then railway variables set MONGODB_DB_AUTH="$MONGODB_DB_AUTH" --service anomalydetection; fi
          if [ -n "$MONGODB_DB_NAME" ]; then railway variables set MONGODB_DB_NAME="$MONGODB_DB_NAME" --service anomalydetection; fi
          if [ -n "$JWT_SECRET" ]; then railway variables set JWT_SECRET="$JWT_SECRET" --service anomalydetection; fi
          railway up --service anomalydetection --detach

  deploy-frontend:
    name: Deploy - Vercel (Frontend)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Déployer sur Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN