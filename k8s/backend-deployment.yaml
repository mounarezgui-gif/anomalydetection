apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: localhost:5000/backend-ci-check:latest
        
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URI
              value: "mongodb://admin:admin123@mongo:27017/anomalydb?authSource=admin"
            - name: MONGODB_URI_AUTH
              value: "mongodb://admin:admin123@mongo:27017/anomalydb?authSource=admin"
            - name: MONGODB_URI_ANALYSES
              value: "mongodb://admin:admin123@mongo:27017/anomalydb?authSource=admin"
            - name: MONGODB_DB_NAME
              value: "network_anomaly_detector"
            - name: MONGODB_DB_AUTH
              value: "authentification"
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: virustotal-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            - name: JWT_ALGORITHM
              value: "HS256"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP