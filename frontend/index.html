<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console d'anomalies réseau</title>
<style>
  :root {
    --bg: #0c1210;
    --panel: #121a17;
    --panel-raised: #17211d;
    --border: #223029;
    --text: #dbe7e0;
    --text-muted: #7c9188;
    --text-dim: #4d5f57;
    --accent: #e8a33d;
    --accent-dim: #8a6428;
    --sev-critical: #e5484d;
    --sev-suspicious: #e8a33d;
    --sev-warning: #d9c04a;
    --sev-info: #4fa8d8;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
    --radius: 3px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-dim); color: var(--text); }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .radar {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--accent-dim);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .radar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, var(--accent) 360deg);
    animation: sweep 2.4s linear infinite;
  }
  .radar::after {
    content: "";
    position: absolute;
    inset: 40%;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px 1px var(--accent);
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .radar::before { animation: none; }
  }

  .brand-text .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand-text h1 {
    margin: 2px 0 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .api-status {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
  .dot.ok { background: #4bb679; box-shadow: 0 0 6px 1px #4bb67955; }
  .dot.down { background: var(--sev-critical); box-shadow: 0 0 6px 1px #e5484d55; }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 65px);
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; height: auto; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .upload-zone {
    margin: 16px;
    padding: 18px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent-dim);
    background: rgba(232, 163, 61, 0.04);
  }
  .upload-zone input { display: none; }
  .upload-zone .upload-label {
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .upload-zone .upload-label strong { color: var(--text); font-weight: 600; }
  .upload-zone .upload-hint {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .analysis-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }
  .list-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 4px 12px 8px;
  }

  .analysis-item {
    padding: 12px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 2px;
    transition: background 0.1s;
  }
  .analysis-item:hover { background: var(--panel-raised); }
  .analysis-item.active {
    background: var(--panel-raised);
    border-color: var(--border);
  }
  .analysis-item .filename {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .analysis-item .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 5px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .badge-row { display: flex; gap: 4px; margin-top: 7px; flex-wrap: wrap; }

  .sev-badge {
    font-family: var(--mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 1.5px 6px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .sev-CRITICAL { color: var(--sev-critical); background: rgba(229,72,77,0.12); }
  .sev-SUSPICIOUS { color: var(--sev-suspicious); background: rgba(232,163,61,0.12); }
  .sev-WARNING { color: var(--sev-warning); background: rgba(217,192,74,0.12); }
  .sev-INFO { color: var(--sev-info); background: rgba(79,168,216,0.12); }

  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  /* ---------- Main panel ---------- */
  .main {
    overflow-y: auto;
    padding: 28px 36px 60px;
  }
  .placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--text-dim);
  }
  .placeholder .radar { width: 40px; height: 40px; opacity: 0.5; }
  .placeholder p { font-size: 13px; max-width: 280px; text-align: center; }

  .detail-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    gap: 16px;
  }
  .detail-header h2 {
    margin: 0 0 4px;
    font-size: 19px;
    font-weight: 600;
    word-break: break-all;
  }
  .detail-header .sub {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .btn {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s;
  }
  .btn:hover { border-color: var(--text-dim); }
  .btn.danger:hover { border-color: var(--sev-critical); color: var(--sev-critical); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--panel);
    padding: 14px 16px;
  }
  .stat .value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
  }
  .stat .label {
    font-size: 10.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .alert-row {
    display: grid;
    grid-template-columns: 90px 90px 1fr 160px;
    gap: 14px;
    align-items: start;
    padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .alert-row:last-child { border-bottom: none; }
  .alert-row .protocole {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .alert-row .description { font-size: 13px; }
  .alert-row .cible {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
  }
  .alert-row .timestamp {
    display: block;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-dim);
    margin-top: 2px;
    text-align: right;
  }
  @media (max-width: 700px) {
    .alert-row { grid-template-columns: 1fr; gap: 4px; }
    .alert-row .cible, .alert-row .timestamp { text-align: left; }
  }

  .section-nav {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .nav-pill {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .nav-pill.active {
    background: var(--panel-raised);
    color: var(--text);
    border-color: var(--accent-dim);
  }

  .page-card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .page-card h3 {
    margin: 0 0 10px;
    font-size: 15px;
  }
  .page-card p {
    margin: 0;
    color: var(--text-muted);
    font-size: 12.5px;
  }

  .conversation-grid {
    display: grid;
    gap: 12px;
  }
  .conversation-card {
    border: 1px solid var(--border);
    background: var(--panel-raised);
    border-radius: var(--radius);
    padding: 14px;
  }
  .conversation-card .card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .conversation-card .card-title {
    font-size: 13px;
    font-weight: 600;
  }
  .conversation-card .card-sub {
    margin-top: 3px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(79, 168, 216, 0.12);
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid rgba(79, 168, 216, 0.27);
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .metric-box {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    background: var(--panel);
  }
  .metric-box .value {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
  }
  .metric-box .label {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .packet-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  .packet-item {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--panel);
  }
  .packet-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
  }
  .packet-main {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .packet-main .route {
    font-size: 12px;
    font-weight: 500;
  }
  .packet-main .meta {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .packet-side {
    text-align: right;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
  }
  @media (max-width: 700px) {
    .packet-item { grid-template-columns: 1fr; }
    .packet-side { text-align: left; }
  }

  .alert-card {
    border: 1px solid var(--border);
    background: var(--panel-raised);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .alert-card .alert-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .alert-title {
    font-size: 13px;
    font-weight: 600;
  }
  .alert-sub {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .detail-grid {
    display: grid;
    gap: 8px;
    margin-top: 10px;
  }
  .detail-entry {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 10px;
    background: var(--panel);
  }
  .detail-entry .detail-key {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .detail-entry .detail-value {
    font-size: 12px;
    color: var(--text);
    word-break: break-word;
  }
  .detail-json {
    margin: 0;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-muted);
    white-space: pre-wrap;
    overflow-x: auto;
  }

  .no-alerts {
    padding: 24px 4px;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 12.5px;
    max-width: 320px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-left-color: var(--sev-critical); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="radar"></div>
    <div class="brand-text">
      <div class="eyebrow">Détection comportementale</div>
      <h1>Console d'anomalies réseau</h1>
    </div>
  </div>
  <div class="api-status">
    <span class="dot" id="apiDot"></span>
    <span id="apiStatusText">connexion...</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <label class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".pcap,.pcapng">
      <div class="upload-label"><strong>Déposer une capture</strong><br>ou cliquer pour parcourir</div>
      <div class="upload-hint">.pcap / .pcapng</div>
    </label>

    <div class="analysis-list" id="analysisList">
      <div class="list-eyebrow">Analyses</div>
      <div class="empty-state">Chargement...</div>
    </div>

    <div style="padding:0 16px 16px;">
      <div class="section-title" style="margin:0 0 8px;">Pages dédiées</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <a href="conversations.html" class="btn" style="display:block; text-align:center; text-decoration:none;">Voir les conversations</a>
        <a href="alerts.html" class="btn" style="display:block; text-align:center; text-decoration:none;">Voir les alertes</a>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="placeholder">
      <div class="radar"></div>
      <p>Sélectionne une analyse à gauche, ou dépose une capture pour commencer.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = "http://127.0.0.1:8000"; // adapte si ton API tourne ailleurs

let currentId = null;
let currentAnalysisData = null;
let currentDetailView = "overview";

function toast(message, isError = false) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = "toast show" + (isError ? " error" : "");
  setTimeout(() => el.classList.remove("show"), 3200);
}

function timeAgo(isoString) {
  const diff = (Date.now() - new Date(isoString).getTime()) / 1000;
  if (diff < 60) return "à l'instant";
  if (diff < 3600) return `il y a ${Math.floor(diff / 60)} min`;
  if (diff < 86400) return `il y a ${Math.floor(diff / 3600)} h`;
  return `il y a ${Math.floor(diff / 86400)} j`;
}

function sevBadge(sev) {
  return `<span class="sev-badge sev-${sev}">${sev}</span>`;
}

async function checkApiHealth() {
  const dot = document.getElementById("apiDot");
  const text = document.getElementById("apiStatusText");
  try {
    const res = await fetch(`${API_BASE}/analyses`);
    if (!res.ok) throw new Error();
    dot.className = "dot ok";
    text.textContent = "API connectée";
    return true;
  } catch {
    dot.className = "dot down";
    text.textContent = "API injoignable";
    return false;
  }
}

async function loadAnalysisList() {
  const list = document.getElementById("analysisList");
  try {
    const res = await fetch(`${API_BASE}/analyses`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const analyses = await res.json();

    if (analyses.length === 0) {
      list.innerHTML = `<div class="list-eyebrow">Analyses</div>
        <div class="empty-state">Aucune analyse pour l'instant.<br>Dépose une capture pour commencer.</div>`;
      return;
    }

    list.innerHTML = `<div class="list-eyebrow">Analyses (${analyses.length})</div>` +
      analyses.map(a => {
        const sevEntries = Object.entries(a.detection_summary.alerts_by_severity || {});
        const badges = sevEntries.map(([sev, count]) => sevBadge(sev) + ` ×${count}`).join(" ");
        return `
          <div class="analysis-item ${a.id === currentId ? 'active' : ''}" data-id="${a.id}">
            <div class="filename">${escapeHtml(a.filename)}</div>
            <div class="meta">
              <span>${timeAgo(a.created_at)}</span>
              <span>·</span>
              <span>${a.total_packets} paquets</span>
            </div>
            ${badges ? `<div class="badge-row">${badges}</div>` : ''}
          </div>`;
      }).join("");

    list.querySelectorAll(".analysis-item").forEach(el => {
      el.addEventListener("click", () => openAnalysis(el.dataset.id));
    });
  } catch (err) {
    list.innerHTML = `<div class="list-eyebrow">Analyses</div>
      <div class="empty-state">Impossible de charger la liste.<br>Vérifie que l'API tourne.</div>`;
  }
}

async function openAnalysis(id) {
  currentId = id;
  currentDetailView = "overview";
  document.querySelectorAll(".analysis-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });

  const main = document.getElementById("main");
  main.innerHTML = `<div class="placeholder"><div class="radar"></div><p>Chargement de l'analyse...</p></div>`;

  try {
    const res = await fetch(`${API_BASE}/analyses/${id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderDetail(data);
  } catch (err) {
    main.innerHTML = `<div class="placeholder"><p>Impossible de charger cette analyse (${err.message}).</p></div>`;
  }
}

function formatDateTime(value) {
  if (!value) return "—";
  try {
    return new Date(value).toLocaleString("fr-FR");
  } catch {
    return value;
  }
}

function formatDuration(value) {
  const seconds = Number(value || 0);
  return `${seconds.toFixed(seconds >= 10 ? 0 : 2)} s`;
}

function renderDetails(details) {
  if (!details || typeof details !== "object" || Array.isArray(details)) {
    return `<div class="detail-entry"><div class="detail-value">${escapeHtml(String(details ?? "Aucun détail supplémentaire."))}</div></div>`;
  }

  const entries = Object.entries(details).map(([key, value]) => {
    let renderedValue = "";
    if (Array.isArray(value)) {
      renderedValue = `<div class="chip-row">${value.map(item => `<span class="chip">${escapeHtml(String(item))}</span>`).join("")}</div>`;
    } else if (value && typeof value === "object") {
      renderedValue = `<pre class="detail-json">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
    } else {
      renderedValue = `<div class="detail-value">${escapeHtml(String(value ?? "—"))}</div>`;
    }

    return `
      <div class="detail-entry">
        <div class="detail-key">${escapeHtml(key)}</div>
        ${renderedValue}
      </div>
    `;
  }).join("");

  return `<div class="detail-grid">${entries}</div>`;
}

function renderCurrentDetailView() {
  if (!currentAnalysisData) return;
  const data = currentAnalysisData;
  const main = document.getElementById("main");
  const cs = data.capture_summary || {};
  const ds = data.detection_summary || { total_alerts: 0, alerts_by_severity: {} };
  const alerts = data.alerts || [];
  const conversations = data.conversations || [];

  const sevOrder = ["CRITICAL", "SUSPICIOUS", "WARNING", "INFO"];
  const sortedAlerts = [...alerts].sort(
    (a, b) => sevOrder.indexOf(a.severite) - sevOrder.indexOf(b.severite)
  );

  const overviewHtml = `
    <div class="page-card">
      <h3>Résumé de la capture</h3>
      <p>Cette vue rapide met en avant les métriques clés et les alertes les plus sévères détectées durant l'analyse.</p>
    </div>
    <div class="section-title">Alertes détectées</div>
    <div id="alertsContainer">
      ${sortedAlerts.length === 0
        ? `<div class="no-alerts">Aucune anomalie détectée sur cette capture.</div>`
        : sortedAlerts.map(a => `
          <div class="alert-row">
            <div>${sevBadge(a.severite)}</div>
            <div class="protocole">${escapeHtml(a.protocole || "")}</div>
            <div>
              <div class="description">${escapeHtml(a.description)}</div>
            </div>
            <div>
              <div class="cible">${escapeHtml(a.cible || "—")}</div>
              <span class="timestamp">${formatDateTime(a.timestamp).split(",")[1] || formatDateTime(a.timestamp)}</span>
            </div>
          </div>
        `).join("")
      }
    </div>
  `;

  const conversationsHtml = `
    <div class="page-card">
      <h3>Conversations observées</h3>
      <p>Chaque conversation regroupe les paquets associés ainsi que les métadonnées principales de l’échange.</p>
    </div>
    ${conversations.length === 0
      ? `<div class="no-alerts">Aucune conversation disponible dans cette analyse.</div>`
      : `<div class="conversation-grid">${conversations.map(conv => {
          const packets = conv.packets || [];
          const protocols = (conv.protocols_used || []).map(p => `<span class="chip">${escapeHtml(p)}</span>`).join("");
          return `
            <div class="conversation-card">
              <div class="card-top">
                <div>
                  <div class="card-title">Conversation #${conv.conversation_id ?? "—"}</div>
                  <div class="card-sub">${escapeHtml(conv.ip_a || "—")} ↔ ${escapeHtml(conv.ip_b || "—")}</div>
                </div>
                <div class="chip-row">${protocols || '<span class="chip">Inconnu</span>'}</div>
              </div>
              <div class="metric-grid">
                <div class="metric-box"><div class="value">${conv.total_packets ?? 0}</div><div class="label">Paquets</div></div>
                <div class="metric-box"><div class="value">${conv.total_bytes ?? 0} B</div><div class="label">Taille</div></div>
                <div class="metric-box"><div class="value">${formatDuration(conv.duration)}</div><div class="label">Durée</div></div>
                <div class="metric-box"><div class="value">${escapeHtml((conv.ports || []).slice(0, 3).join(", ") || "—")}</div><div class="label">Ports</div></div>
              </div>
              <div class="packet-list">
                ${packets.length === 0
                  ? '<div class="no-alerts">Aucun paquet détaillé pour cette conversation.</div>'
                  : packets.slice(0, 10).map(pkt => `
                    <div class="packet-item">
                      <div class="packet-number">#${pkt.packet_number ?? "—"}</div>
                      <div class="packet-main">
                        <div class="route">${escapeHtml(pkt.src_ip || "—")}:${pkt.src_port ?? "—"} → ${escapeHtml(pkt.dst_ip || "—")}:${pkt.dst_port ?? "—"}</div>
                        <div class="meta">${escapeHtml(pkt.protocol || "—")} · ${escapeHtml(pkt.timestamp_iso || pkt.timestamp || "—")}</div>
                      </div>
                      <div class="packet-side">${pkt.length_bytes ?? 0} B<br>${pkt.tcp ? `${pkt.tcp.syn ? "SYN" : ""}${pkt.tcp.ack ? " ACK" : ""}${pkt.tcp.rst ? " RST" : ""}`.trim() || "—" : "—"}</div>
                    </div>
                  `).join("")
                }
              </div>
            </div>
          `;
        }).join("")}</div>`
    }
  `;

  const alertsHtml = `
    <div class="page-card">
      <h3>Détails des alertes</h3>
      <p>Chaque alerte expose sa règle, sa cible, sa gravité et les détails techniques associés.</p>
    </div>
    ${sortedAlerts.length === 0
      ? `<div class="no-alerts">Aucune alerte disponible pour cette analyse.</div>`
      : sortedAlerts.map(alert => `
        <div class="alert-card">
          <div class="alert-head">
            <div>
              <div class="alert-title">${escapeHtml(alert.rule_id || "Alerte")}</div>
              <div class="alert-sub">${escapeHtml(alert.protocole || "—")} · ${escapeHtml(alert.cible || "—")} · ${formatDateTime(alert.timestamp)}</div>
            </div>
            ${sevBadge(alert.severite)}
          </div>
          <div class="description">${escapeHtml(alert.description || "Aucune description fournie.")}</div>
          ${renderDetails(alert.details)}
        </div>
      `).join("")
    }
  `;

  const content = currentDetailView === "conversations" ? conversationsHtml : currentDetailView === "alerts" ? alertsHtml : overviewHtml;

  main.innerHTML = `
    <div class="detail-header">
      <div>
        <h2>${escapeHtml(data.filename)}</h2>
        <div class="sub">${data.id} · ${formatDateTime(data.created_at)}</div>
      </div>
      <button class="btn danger" id="deleteBtn">Supprimer</button>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="value">${cs.total_packets ?? "—"}</div><div class="label">Paquets</div></div>
      <div class="stat"><div class="value">${cs.total_conversations ?? "—"}</div><div class="label">Conversations</div></div>
      <div class="stat"><div class="value">${ds.total_alerts}</div><div class="label">Alertes</div></div>
      <div class="stat"><div class="value">${formatDuration(cs.duration)}</div><div class="label">Durée capture</div></div>
    </div>

    <div class="section-nav">
      <button class="nav-pill ${currentDetailView === "overview" ? "active" : ""}" data-view="overview">Vue d'ensemble</button>
      <button class="nav-pill ${currentDetailView === "conversations" ? "active" : ""}" data-view="conversations">Conversations</button>
      <button class="nav-pill ${currentDetailView === "alerts" ? "active" : ""}" data-view="alerts">Alertes</button>
    </div>

    <div id="detailViewContent">${content}</div>
  `;

  main.querySelectorAll(".nav-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      currentDetailView = btn.dataset.view;
      renderCurrentDetailView();
    });
  });

  document.getElementById("deleteBtn").addEventListener("click", () => deleteAnalysis(data.id));
}

function renderDetail(data) {
  currentAnalysisData = data;
  renderCurrentDetailView();
}

async function deleteAnalysis(id) {
  if (!confirm("Supprimer définitivement cette analyse ?")) return;
  try {
    const res = await fetch(`${API_BASE}/analyses/${id}`, { method: "DELETE" });
    if (res.status !== 204) throw new Error(`HTTP ${res.status}`);
    toast("Analyse supprimée.");
    currentId = null;
    currentAnalysisData = null;
    currentDetailView = "overview";
    document.getElementById("main").innerHTML = `
      <div class="placeholder"><div class="radar"></div>
      <p>Sélectionne une analyse à gauche, ou dépose une capture pour commencer.</p></div>`;
    loadAnalysisList();
  } catch (err) {
    toast(`Échec de la suppression : ${err.message}`, true);
  }
}

async function uploadFile(file) {
  if (!file) return;
  const validExt = /\.(pcap|pcapng)$/i.test(file.name);
  if (!validExt) {
    toast("Extension non supportée. Utilise un .pcap ou .pcapng.", true);
    return;
  }

  toast(`Analyse de ${file.name} en cours...`);
  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch(`${API_BASE}/analyses`, { method: "POST", body: formData });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    toast(`${body.detection_summary.total_alerts} alerte(s) détectée(s) dans ${file.name}.`);
    await loadAnalysisList();
    openAnalysis(body.id);
  } catch (err) {
    toast(`Échec de l'analyse : ${err.message}`, true);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

// --- Wiring upload zone (click + drag & drop) ---
const uploadZone = document.getElementById("uploadZone");
const fileInput = document.getElementById("fileInput");
fileInput.addEventListener("change", () => uploadFile(fileInput.files[0]));

["dragover", "dragenter"].forEach(evt =>
  uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.add("dragover"); })
);
["dragleave", "drop"].forEach(evt =>
  uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.remove("dragover"); })
);
uploadZone.addEventListener("drop", e => {
  const file = e.dataTransfer.files[0];
  uploadFile(file);
});

// --- Init ---
checkApiHealth();
loadAnalysisList();
setInterval(checkApiHealth, 15000);
</script>
</body>
</html>
