<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Créer un compte</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-card">
    <p class="auth-eyebrow">Bienvenue</p>
    <h1 class="auth-title">Créer un compte</h1>

    <div class="auth-error" id="error-box"></div>

    <form id="register-form">
      <div class="auth-field">
        <label for="nom">Nom</label>
        <input id="nom" type="text" required autocomplete="name" />
      </div>

      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>

      <div class="auth-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required minlength="6" autocomplete="new-password" />
      </div>

      <button class="auth-submit" type="submit" id="submit-btn">S'inscrire</button>
    </form>

    <p class="auth-switch">
      Déjà un compte ? <a href="login.html">Se connecter</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Création...";

      const nom = document.getElementById("nom").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        // Tout nouveau compte est créé avec le rôle "user" côté serveur.
        await registerRequest(nom, email, password);
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("visible");
        submitBtn.disabled = false;
        submitBtn.textContent = "S'inscrire";
      }
    });
  </script>
</body>
</html>
