<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-card">
    <p class="auth-eyebrow">Bon retour</p>
    <h1 class="auth-title">Connexion</h1>

    <div class="auth-error" id="error-box"></div>

    <form id="login-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email" />
      </div>

      <div class="auth-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" />
      </div>

      <button class="auth-submit" type="submit" id="submit-btn">Se connecter</button>
    </form>

    <p class="auth-switch">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const user = await loginRequest(email, password);
        // redirection selon le rôle (admin -> admin.html, user -> conversations.html)
        window.location.href = redirectPathFor(user);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("visible");
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
