<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversations réseau</title>
<style>
  :root {
    --bg: #0c1210;
    --panel: #121a17;
    --panel-raised: #17211d;
    --border: #223029;
    --text: #dbe7e0;
    --text-muted: #7c9188;
    --text-dim: #4d5f57;
    --accent: #e8a33d;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Inter,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:18px 24px; border-bottom:1px solid var(--border); background:var(--panel); }
  .nav { display:flex; gap:8px; flex-wrap:wrap; }
  .nav a { color:var(--text-muted); text-decoration:none; padding:7px 10px; border:1px solid transparent; border-radius:999px; }
  .nav a.active { color:var(--text); border-color:var(--border); background:var(--panel-raised); }
  .container { max-width:1100px; margin:0 auto; padding:24px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  select, button { font:inherit; padding:8px 10px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel-raised); color:var(--text); }
  .conversation-grid { display:grid; gap:12px; }
  .conversation-card { border:1px solid var(--border); background:var(--panel-raised); border-radius:var(--radius); padding:14px; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--text-muted); margin-top:4px; }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { padding:3px 8px; border:1px solid rgba(79,168,216,0.3); border-radius:999px; background:rgba(79,168,216,0.12); font-family:var(--mono); font-size:10px; }
  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-top:10px; }
  .metric-box { border:1px solid var(--border); background:var(--panel); padding:8px 10px; border-radius:var(--radius); }
  .metric-box .value { font-family:var(--mono); font-size:12px; }
  .metric-box .label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .packet-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .packet-item { display:grid; grid-template-columns:70px 1fr auto; gap:10px; align-items:center; border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; background:var(--panel); }
  .packet-number { font-family:var(--mono); color:var(--accent); font-size:11px; }
  .packet-main .route { font-size:12px; font-weight:600; }
  .packet-main .meta { font-size:10.5px; }
  .packet-side { text-align:right; font-size:10px; color:var(--text-muted); font-family:var(--mono); }
  .empty { color:var(--text-dim); padding:16px 0; }
  @media (max-width:700px){ .packet-item { grid-template-columns:1fr; } .packet-side { text-align:left; } }
</style>
</head>
<body>
<header>
  <strong>Conversations réseau</strong>
  <div class="nav">
    <a href="index.html">Accueil</a>
    <a class="active" href="conversations.html">Conversations</a>
    <a href="alerts.html">Alertes</a>
  </div>
</header>
<div class="container">
  <div class="card">
    <label for="analysisSelect">Analyse</label>
    <select id="analysisSelect" style="margin-top:8px; width:100%;"></select>
  </div>
  <div id="content"></div>
</div>
<script>
const API_BASE = "http://127.0.0.1:8000";

async function loadAnalyses() {
  const select = document.getElementById("analysisSelect");
  try {
    const res = await fetch(`${API_BASE}/analyses`);
    if (!res.ok) throw new Error();
    const analyses = await res.json();
    select.innerHTML = analyses.map(a => `<option value="${a.id}">${a.filename}</option>`).join("");
    if (analyses[0]) {
      await renderAnalysis(analyses[0].id);
    }
  } catch {
    document.getElementById("content").innerHTML = '<div class="empty">Impossible de charger les analyses. Vérifiez que l’API est en cours d’exécution.</div>';
  }
}

async function renderAnalysis(id) {
  const content = document.getElementById("content");
  try {
    const res = await fetch(`${API_BASE}/analyses/${id}`);
    if (!res.ok) throw new Error();
    const data = await res.json();
    const conversations = data.conversations || [];
    content.innerHTML = `
      <div class="card">
        <h3>${escapeHtml(data.filename)}</h3>
        <div class="meta">${escapeHtml(data.id)}</div>
      </div>
      ${conversations.length === 0 ? '<div class="empty">Aucune conversation disponible.</div>' : `<div class="conversation-grid">${conversations.map(conv => `
        <div class="conversation-card">
          <div><strong>Conversation #${conv.conversation_id ?? "—"}</strong></div>
          <div class="meta">${escapeHtml(conv.ip_a || "—")} ↔ ${escapeHtml(conv.ip_b || "—")}</div>
          <div class="chip-row">${(conv.protocols_used || []).map(p => `<span class="chip">${escapeHtml(p)}</span>`).join("")}</div>
          <div class="metric-grid">
            <div class="metric-box"><div class="value">${conv.total_packets ?? 0}</div><div class="label">Paquets</div></div>
            <div class="metric-box"><div class="value">${conv.total_bytes ?? 0} B</div><div class="label">Taille</div></div>
            <div class="metric-box"><div class="value">${Number(conv.duration || 0).toFixed(2)} s</div><div class="label">Durée</div></div>
            <div class="metric-box"><div class="value">${(conv.ports || []).slice(0, 4).join(", ") || "—"}</div><div class="label">Ports</div></div>
          </div>
          <div class="packet-list">
            ${(conv.packets || []).slice(0, 8).map(pkt => `
              <div class="packet-item">
                <div class="packet-number">#${pkt.packet_number ?? "—"}</div>
                <div class="packet-main">
                  <div class="route">${escapeHtml(pkt.src_ip || "—")}:${pkt.src_port ?? "—"} → ${escapeHtml(pkt.dst_ip || "—")}:${pkt.dst_port ?? "—"}</div>
                  <div class="meta">${escapeHtml(pkt.protocol || "—")} · ${escapeHtml(pkt.timestamp_iso || pkt.timestamp || "—")}</div>
                </div>
                <div class="packet-side">${pkt.length_bytes ?? 0} B</div>
              </div>
            `).join("")}
          </div>
        </div>
      `).join("")}</div>`}
    `;
  } catch {
    content.innerHTML = '<div class="empty">Impossible de charger le détail de cette analyse.</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

document.getElementById("analysisSelect").addEventListener("change", (e) => renderAnalysis(e.target.value));
loadAnalyses();
</script>
</body>
</html>
